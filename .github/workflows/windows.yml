name: Windows x64
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@v7
        with:
          path: luce-fonts
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-base
          path: luce-base
      # every dependency at main, beside this checkout (luce-base docs/CI.md)
      - name: Check out dependencies at main
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          python luce-base/tools/checkout_main.py luce-fonts
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-vulkan-devel
            mingw-w64-ucrt-x86_64-vulkan-loader
      - name: Configure native library search
        shell: msys2 {0}
        run: echo "LIBRARY_PATH=$(cygpath -m /ucrt64/lib)" >> "$GITHUB_ENV"
      - name: Build the compiler
        working-directory: luce-base
        shell: msys2 {0}
        run: python tools/build_windows.py
      - name: Module tests through both backends
        working-directory: luce-fonts
        shell: msys2 {0}
        run: python tests/run.py --base ../luce-base/build/luce-base.exe --skip-programs
      - name: Windows contracts
        working-directory: luce-fonts
        shell: msys2 {0}
        run: |
          python tests/programs/fonts/run.py ../luce-base/build/luce-base.exe
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: luce-fonts-windows-${{ github.sha }}
          path: |
            luce-fonts/build/*.json
            luce-fonts/build/*.log
          if-no-files-found: ignore
