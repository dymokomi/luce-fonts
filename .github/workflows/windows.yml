name: Windows x64
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@v7
        with:
          path: luce-fonts
      - name: Read compiler and dependency pins
        id: pins
        shell: pwsh
        run: |
          "base=$(Get-Content luce-fonts/bootstrap/BASE)" >> $env:GITHUB_OUTPUT
          "std=$(Get-Content luce-fonts/bootstrap/STD)" >> $env:GITHUB_OUTPUT
          "window=$(Get-Content luce-fonts/bootstrap/WINDOW)" >> $env:GITHUB_OUTPUT
          "gpu=$(Get-Content luce-fonts/bootstrap/GPU)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-base
          ref: ${{ steps.pins.outputs.base }}
          path: luce-base
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-std
          ref: ${{ steps.pins.outputs.std }}
          path: luce-std
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-window
          ref: ${{ steps.pins.outputs.window }}
          path: luce-window
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-gpu
          ref: ${{ steps.pins.outputs.gpu }}
          path: luce-gpu
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-vulkan-devel
            mingw-w64-ucrt-x86_64-vulkan-loader
      - name: Configure native library search
        shell: msys2 {0}
        run: echo "LIBRARY_PATH=$(cygpath -m /ucrt64/lib)" >> "$GITHUB_ENV"
      - name: Build the compiler
        working-directory: luce-base
        shell: msys2 {0}
        run: python tools/build_windows.py
      - name: Module tests through both backends
        working-directory: luce-fonts
        shell: msys2 {0}
        run: python tests/run.py --base ../luce-base/build/luce-base.exe --skip-programs
      - name: Windows contracts
        working-directory: luce-fonts
        shell: msys2 {0}
        run: |
          python tests/programs/fonts/run.py ../luce-base/build/luce-base.exe
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: luce-fonts-windows-${{ github.sha }}
          path: |
            luce-fonts/build/*.json
            luce-fonts/build/*.log
          if-no-files-found: ignore
